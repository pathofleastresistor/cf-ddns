services:
  cf-ddns:
    build: .
    container_name: cloudflare-ddns
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/heartbeat -mmin -5 || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

networks:
  default:
    external: true
    name: nginx_proxy_manager